<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>TLS 1.2 / 1.3 握手示意动画</title>
<style>
:root{color-scheme:light dark;--bg:#f5f8fc;--ink:#182b45;--muted:#52647c;--line:#94a3b8;--accent:#12665e;--card:#fff}*{box-sizing:border-box}body{margin:0;padding:18px;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--ink)}h1{font-size:19px;margin:0 0 6px}p{margin:8px 0}.intro{font-size:13px;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink);background:var(--card);cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #14b8a6;outline-offset:2px}canvas{display:block;width:100%;height:275px;border:1px solid var(--line);border-radius:8px;background:var(--card)}#status{min-height:76px;font-size:14px}a{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#101c2c;--ink:#e1ebfa;--muted:#a5b5cd;--line:#61738f;--accent:#6ee7d3;--card:#16263c}}@media(max-width:420px){body{padding:12px}button,select{font-size:14px}#status{min-height:100px}} 
</style>
</head>
<body>
<h1>TLS 握手：消息怎样往返？</h1>
<p class="intro">已建立底层连接 · 服务器证书认证 · 无恢复、无重试 · 箭头表示消息组，非 TCP 分包</p>
<div class="controls"><label for="version">版本 <select id="version"><option value="13">TLS 1.3 · 1-RTT</option><option value="12">TLS 1.2 · 2-RTT</option></select></label><button id="play" type="button">播放</button><button id="next" type="button">下一步</button><button id="reset" type="button">重置</button></div>
<canvas width="800" height="330" role="img" aria-label="客户端与服务器之间的握手消息；每一步的完整解释见下方文字">握手顺序：客户端问候 → 服务器身份与密钥参数 → 客户端确认 → 应用数据。详见文章中的对比表。</canvas>
<p id="status" aria-live="polite"></p>
<p class="intro">TLS 1.2 示例采用 ECDHE；TLS 1.3 服务器在 ServerHello 后加密握手消息。这里不计 DNS 与底层连接建立时间，不展示 0-RTT。默认不自动播放。</p>
<p class="intro">依据 RFC 5246 §7.3 与 TLS 1.3 握手规范制作；完整来源见正文。</p>
<noscript>动画需要 JavaScript。请阅读完整文章中的静态握手表；全部关键事实均可在无脚本情况下阅读。</noscript>
<script>
(() => {
const versions = {
 '13': [
  ['ClientHello + key_share', 1, '客户端发送协议能力与临时密钥交换公开参数（key_share）。'],
  ['ServerHello + server flight', -1, '服务器发送 ServerHello；随后发送加密的 EncryptedExtensions、Certificate、CertificateVerify、Finished。客户端验证证书和握手证明，并派生流量密钥。'],
  ['Finished + application data', 1, '客户端发送 Finished，随后可发送应用数据。服务器验证 Finished。在此示例中，客户端经历约 1-RTT 后可发应用数据。']
 ],
 '12': [
  ['ClientHello', 1, '客户端先声明支持的协议能力和密码套件。'],
  ['ServerHello + server flight', -1, '服务器发送 ServerHello、Certificate、ServerKeyExchange、ServerHelloDone。ServerKeyExchange 携带临时 ECDHE 参数及签名。'],
  ['ClientKeyExchange + Finished', 1, '客户端验证服务器，发送 ClientKeyExchange、ChangeCipherSpec 和 Finished。'],
  ['Server Finished', -1, '服务器发送 ChangeCipherSpec、Finished。客户端验证后，完成此示例握手。'],
  ['Application data', 1, '客户端现在可发送应用数据：此前等待约 2-RTT，不计底层连接建立。']
 ]
};
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const select=document.querySelector('#version'),play=document.querySelector('#play'),next=document.querySelector('#next');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let step=0,raf=0,start=0,progress=1,playing=false;
function rows(){return versions[select.value]}
function draw(){
 const colors=getComputedStyle(document.documentElement),ink=colors.getPropertyValue('--ink').trim(),line=colors.getPropertyValue('--line').trim(),accent=colors.getPropertyValue('--accent').trim();
 const w=canvas.clientWidth,h=275,dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const left=42,right=w-42;ctx.font='14px system-ui';ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText('客户端',left,24);ctx.fillText('服务器',right,24);
 ctx.strokeStyle=line;ctx.setLineDash([4,5]);for(const x of [left,right]){ctx.beginPath();ctx.moveTo(x,34);ctx.lineTo(x,265);ctx.stroke()}ctx.setLineDash([]);
 rows().forEach((row,i)=>{if(i>=step)return;const y=57+i*43,from=row[1]===1?left:right,to=row[1]===1?right:left,p=i===step-1?progress:1,end=from+(to-from)*p;
 ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(from,y);ctx.lineTo(end,y);ctx.stroke();const sign=row[1];ctx.beginPath();ctx.moveTo(end,y);ctx.lineTo(end-sign*7,y-4);ctx.lineTo(end-sign*7,y+4);ctx.closePath();ctx.fillStyle=accent;ctx.fill();
 ctx.fillStyle=ink;ctx.font=(w<420?'10':'13')+'px system-ui';ctx.fillText(row[0],w/2,y-9);
 });
}
function update(){status.textContent=step===0?'准备就绪：选择版本，点击“播放”或“下一步”。':`第 ${step}/${rows().length} 步：${rows()[step-1][2]}`;next.disabled=step===rows().length;draw()}
function pause(){playing=false;cancelAnimationFrame(raf);raf=0;progress=1;play.textContent=step===rows().length?'重播':'播放';draw()}
function frame(now){if(!playing)return;const elapsed=now-start;progress=reduced.matches?1:Math.min(elapsed/700,1);draw();if(elapsed>=2500){if(step===rows().length){pause();return}step++;start=now;progress=reduced.matches?1:0;update()}raf=requestAnimationFrame(frame)}
play.addEventListener('click',()=>{if(playing){pause();return}if(step===rows().length)step=0;if(step===0)step=1;playing=true;start=performance.now();progress=reduced.matches?1:0;play.textContent='暂停';update();raf=requestAnimationFrame(frame)});
next.addEventListener('click',()=>{pause();step=Math.min(step+1,rows().length);update();play.textContent=step===rows().length?'重播':'播放'});
function reset(){pause();step=0;progress=1;play.textContent='播放';update()}
select.addEventListener('change',reset);document.querySelector('#reset').addEventListener('click',reset);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});new ResizeObserver(draw).observe(canvas);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);reduced.addEventListener('change',()=>{pause();update()});update();
})();
</script>
</body>
</html>
