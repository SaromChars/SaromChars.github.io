<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 670" width="100%" height="100%">
  <title>TLS 1.3 单向证书认证握手时序示意</title>
  <desc>教学示意图：展示 TLS 1.3 单向证书认证 1-RTT 握手消息时序与 ServerHello 之后的记录层加密边界划分，省略应用流量密钥派生细节。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .role-box { fill: #ffffff; stroke: #475569; stroke-width: 1.5; rx: 6px; }
      .role-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4 4; }
      .plain-arrow { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue-arr); }
      .enc-arrow { stroke: #059669; stroke-width: 2.5; marker-end: url(#green-arr); }
      .app-arrow { stroke: #d97706; stroke-width: 3; marker-end: url(#amber-arr); marker-start: url(#amber-arr-start); }
      .msg-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18.5px; font-weight: bold; }
      .msg-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; fill: #334155; }
      .boundary-line { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 3; }
      .boundary-box { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; rx: 4px; }
      .boundary-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #b91c1c; text-anchor: middle; }
    </style>
    <marker id="blue-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="green-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#059669" />
    </marker>
    <marker id="amber-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#d97706" />
    </marker>
    <marker id="amber-arr-start" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="7 0, 0 3.5, 7 7" fill="#d97706" />
    </marker>
  </defs>

  <rect width="380" height="670" class="bg" rx="10" />

  <!-- 泳道角色头 -->
  <rect x="25" y="15" width="130" height="45" class="role-box" />
  <text x="90" y="44" class="role-text">客户端</text>
  <line x1="90" y1="60" x2="90" y2="650" class="lifeline" />

  <rect x="225" y="15" width="130" height="45" class="role-box" />
  <text x="290" y="44" class="role-text">服务端</text>
  <line x1="290" y1="60" x2="290" y2="650" class="lifeline" />

  <!-- 1. ClientHello -->
  <line x1="90" y1="95" x2="282" y2="95" class="plain-arrow" />
  <text x="190" y="90" text-anchor="middle" class="msg-title" style="fill:#1d4ed8;">ClientHello (明文)</text>
  <text x="190" y="118" text-anchor="middle" class="msg-desc">携带 key_share 公钥与套件</text>

  <!-- 2. ServerHello -->
  <line x1="290" y1="165" x2="98" y2="165" class="plain-arrow" />
  <text x="190" y="158" text-anchor="middle" class="msg-title" style="fill:#1d4ed8;">ServerHello (明文)</text>
  <text x="190" y="188" text-anchor="middle" class="msg-desc">回复 key_share 公钥</text>

  <!-- 加密分界线 -->
  <line x1="15" y1="210" x2="365" y2="210" class="boundary-line" />
  <rect x="35" y="200" width="310" height="34" class="boundary-box" />
  <text x="190" y="224" class="boundary-text">【加密分界：后续报文密文传输】</text>

  <!-- 3. 服务端密文握手报文 -->
  <line x1="290" y1="270" x2="98" y2="270" class="enc-arrow" />
  <text x="190" y="260" text-anchor="middle" class="msg-title" style="fill:#047857;">{EncryptedExtensions}</text>
  
  <line x1="290" y1="315" x2="98" y2="315" class="enc-arrow" />
  <text x="190" y="305" text-anchor="middle" class="msg-title" style="fill:#047857;">{Certificate}</text>
  <text x="190" y="335" text-anchor="middle" class="msg-desc">出示 X.509 证书链</text>

  <line x1="290" y1="380" x2="98" y2="380" class="enc-arrow" />
  <text x="190" y="370" text-anchor="middle" class="msg-title" style="fill:#047857;">{CertificateVerify}</text>
  <text x="190" y="400" text-anchor="middle" class="msg-desc">私钥对先前转录签名</text>

  <line x1="290" y1="445" x2="98" y2="445" class="enc-arrow" />
  <text x="190" y="435" text-anchor="middle" class="msg-title" style="fill:#047857;">{Finished}</text>
  <text x="190" y="465" text-anchor="middle" class="msg-desc">服务端握手密钥确认</text>
  <text x="190" y="490" text-anchor="middle" class="msg-desc" style="font-size:18px; fill:#047857;">(覆盖至其 Verify 的转录)</text>

  <!-- 4. 客户端 Finished -->
  <line x1="90" y1="535" x2="282" y2="535" class="enc-arrow" />
  <text x="190" y="525" text-anchor="middle" class="msg-title" style="fill:#047857;">{Finished}</text>
  <text x="190" y="555" text-anchor="middle" class="msg-desc">客户端验证后回复确认</text>
  <text x="190" y="580" text-anchor="middle" class="msg-desc" style="font-size:18px; fill:#047857;">(覆盖至服务端 Finished)</text>

  <!-- 5. 应用数据 -->
  <line x1="98" y1="620" x2="282" y2="620" class="app-arrow" />
  <text x="190" y="612" text-anchor="middle" class="msg-title" style="fill:#b45309;">双向应用数据 (AEAD)</text>
  <text x="190" y="642" text-anchor="middle" class="msg-desc">完成 1-RTT 握手，业务数据传输</text>
</svg>
