<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="100%" height="100%">
  <title>自回归文本生成循环流程图（竖排手机适配）</title>
  <desc>展示提示词输入、包含因果掩码的前向传播、LM Head与Softmax概率预测、解码采样策略以及EOS终止或拼入序列重新循环的完整生成闭环。</desc>

  <rect x="0" y="0" width="400" height="680" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 顶部标题 -->
  <text x="200" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">自回归文本生成循环</text>
  <text x="200" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#475569">逐步生成与因果掩码闭环</text>

  <!-- 步骤 1: 提示词输入 -->
  <g transform="translate(20, 85)">
    <rect x="0" y="0" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">1. 提示词输入 (Prompt)</text>
    <text x="180" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0f172a">当前序列：[x_1, ..., x_n]</text>
  </g>

  <!-- 箭头 1 -->
  <path d="M 200 151 L 200 169" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,169 200,179 207,169" fill="#64748b"/>

  <!-- 步骤 2: Transformer 前向 -->
  <g transform="translate(20, 181)">
    <rect x="0" y="0" width="360" height="66" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#312e81">2. Transformer 前向计算</text>
    <text x="180" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4338ca">应用因果掩码阻断未来信息</text>
  </g>

  <!-- 箭头 2 -->
  <path d="M 200 247 L 200 265" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,265 200,275 207,265" fill="#64748b"/>

  <!-- 步骤 3: LM Head + Softmax -->
  <g transform="translate(20, 277)">
    <rect x="0" y="0" width="360" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">3. 词表概率预测 (Softmax)</text>
    <text x="180" y="54" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d4ed8">取末位隐藏状态 h_n</text>
    <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d4ed8">LM Head 投影生成全词表概率</text>
  </g>

  <!-- 箭头 3 -->
  <path d="M 200 365 L 200 383" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,383 200,393 207,383" fill="#64748b"/>

  <!-- 步骤 4: 解码策略采样 -->
  <g transform="translate(20, 395)">
    <rect x="0" y="0" width="360" height="88" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#92400e">4. 解码策略选取 Token</text>
    <text x="180" y="54" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b45309">贪心 / Top-k / 核采样 (Top-p)</text>
    <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b45309">选定下一 token：x_(n+1)</text>
  </g>

  <!-- 箭头 4 -->
  <path d="M 200 483 L 200 501" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,501 200,511 207,501" fill="#64748b"/>

  <!-- 步骤 5: 终止判定与循环分支 -->
  <g transform="translate(20, 513)">
    <rect x="0" y="0" width="360" height="145" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">5. 终止判断与追加循环</text>

    <!-- 分支 A: 结束 -->
    <rect x="15" y="42" width="155" height="88" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="92" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">命中 EOS / 上限</text>
    <text x="92" y="102" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">终止生成流程</text>

    <!-- 分支 B: 拼入继续 -->
    <rect x="190" y="42" width="155" height="88" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="267" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">未触发终止</text>
    <text x="267" y="102" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#15803d">拼入序列并重入</text>
  </g>
</svg>
