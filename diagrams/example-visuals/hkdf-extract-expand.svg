<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 600" width="100%" height="100%">
  <title>通用 HKDF 提取与展开机制示意</title>
  <desc>教学示意图：展示 HKDF 通用 Extract-then-Expand 机制。原始高熵材料经 Extract 浓缩为 PRK，再经不同 info 标签独立调用 Expand 派生出用途隔离的独立子密钥。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .extract-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6px; }
      .prk-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 6px; }
      .expand-box { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 6px; }
      .out-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 6px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18.5px; font-weight: bold; fill: #1e293b; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; fill: #334155; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .blue-arrow { stroke: #2563eb; stroke-width: 2.5; marker-end: url(#b-arr); }
      .green-arrow { stroke: #059669; stroke-width: 2; marker-end: url(#g-arr); }
    </style>
    <marker id="b-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="g-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#059669" />
    </marker>
  </defs>

  <rect width="380" height="600" class="bg" rx="10" />

  <!-- 阶段 1：Extract -->
  <rect x="15" y="15" width="350" height="190" class="box" />
  <text x="190" y="42" text-anchor="middle" class="h2" style="fill:#1d4ed8;">阶段 1：HKDF-Extract (提取)</text>

  <!-- 输入 -->
  <rect x="25" y="55" width="330" height="55" class="extract-box" />
  <text x="35" y="80" class="text">输入：IKM (高熵原始密钥材料)</text>
  <text x="35" y="102" class="text">可选：Salt (独立随机盐)</text>

  <line x1="190" y1="110" x2="190" y2="135" class="blue-arrow" />

  <!-- 提取运算与输出 PRK -->
  <rect x="45" y="140" width="290" height="55" class="prk-box" />
  <text x="190" y="163" text-anchor="middle" class="text" style="font-weight:bold;">HMAC 浓缩输出均匀伪随机密钥</text>
  <text x="190" y="186" text-anchor="middle" class="code" style="fill:#b45309;">PRK (长度 = HashLen)</text>

  <!-- 连接线：PRK 进入 Expand 阶段 -->
  <line x1="190" y1="205" x2="190" y2="235" class="blue-arrow" />

  <!-- 阶段 2：Expand -->
  <rect x="15" y="240" width="350" height="345" class="box" />
  <text x="190" y="268" text-anchor="middle" class="h2" style="fill:#047857;">阶段 2：HKDF-Expand (展开)</text>
  <text x="190" y="293" text-anchor="middle" class="text" style="font-size:18px;">同一 PRK 按不同标签独立派生：</text>

  <!-- 独立展开分支 A -->
  <rect x="25" y="305" width="330" height="80" class="expand-box" />
  <text x="35" y="332" class="code" style="fill:#047857;">Expand(PRK, info_A, L_A)</text>
  <line x1="35" y1="345" x2="130" y2="345" class="green-arrow" />
  <rect x="140" y="342" width="205" height="35" class="out-box" />
  <text x="242" y="365" text-anchor="middle" class="h2" style="font-size:18px;">子密钥 A (用途 A)</text>

  <!-- 独立展开分支 B -->
  <rect x="25" y="395" width="330" height="80" class="expand-box" />
  <text x="35" y="422" class="code" style="fill:#047857;">Expand(PRK, info_B, L_B)</text>
  <line x1="35" y1="435" x2="130" y2="435" class="green-arrow" />
  <rect x="140" y="432" width="205" height="35" class="out-box" />
  <text x="242" y="455" text-anchor="middle" class="h2" style="font-size:18px;">子密钥 B (用途 B)</text>

  <!-- 独立展开分支 C -->
  <rect x="25" y="485" width="330" height="85" class="expand-box" />
  <text x="35" y="512" class="code" style="fill:#047857;">Expand(PRK, info_C, L_C)</text>
  <line x1="35" y1="525" x2="130" y2="525" class="green-arrow" />
  <rect x="140" y="522" width="205" height="35" class="out-box" />
  <text x="242" y="545" text-anchor="middle" class="h2" style="font-size:18px;">子密钥 C (用途 C)</text>

  <text x="190" y="578" text-anchor="middle" class="text" style="font-size:18px; fill:#64748b;">标签隔离各子密钥，不替代慢哈希</text>
</svg>
