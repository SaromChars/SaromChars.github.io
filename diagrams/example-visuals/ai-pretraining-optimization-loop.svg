<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="100%" height="100%">
  <title>预训练参数更新循环流程图（竖排手机适配）</title>
  <desc>展示批次前向传播、交叉熵损失计算、误差反向传播、梯度裁剪、Adam优化器更新与权重迭代更新的优化循环。</desc>

  <rect x="0" y="0" width="400" height="680" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 顶部标题 -->
  <text x="200" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">预训练参数优化更新流向</text>
  <text x="200" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#475569">损失计算、反向传播与优化器</text>

  <!-- 步骤 1: 批次前向传播 -->
  <g transform="translate(20, 85)">
    <rect x="0" y="0" width="360" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#334155">1. 批次输入与前向计算</text>
    <text x="180" y="52" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#0f172a">Transformer 因果前向输出</text>
  </g>

  <!-- 箭头 1 -->
  <path d="M 200 151 L 200 169" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,169 200,179 207,169" fill="#64748b"/>

  <!-- 步骤 2: 交叉熵损失 -->
  <g transform="translate(20, 181)">
    <rect x="0" y="0" width="360" height="88" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#92400e">2. 交叉熵损失计算 (Loss)</text>
    <text x="180" y="54" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b45309">对比各位置预测与真实目标</text>
    <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b45309">求全序列标量均值损失 L</text>
  </g>

  <!-- 箭头 2 -->
  <path d="M 200 269 L 200 287" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,287 200,297 207,287" fill="#64748b"/>

  <!-- 步骤 3: 误差反向传播求导 -->
  <g transform="translate(20, 299)">
    <rect x="0" y="0" width="360" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">3. 链式法则反向传播</text>
    <text x="180" y="54" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d4ed8">向后传播误差敏感度</text>
    <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d4ed8">计算各参数梯度：g = dL/dW</text>
  </g>

  <!-- 箭头 3 -->
  <path d="M 200 387 L 200 405" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,405 200,415 207,405" fill="#64748b"/>

  <!-- 步骤 4: 梯度裁剪与优化器 -->
  <g transform="translate(20, 417)">
    <rect x="0" y="0" width="360" height="88" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#312e81">4. 梯度裁剪与优化器</text>
    <text x="180" y="54" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4338ca">裁剪全局范数防梯度爆炸</text>
    <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#4338ca">Adam 维护一阶矩与二阶矩</text>
  </g>

  <!-- 箭头 4 -->
  <path d="M 200 505 L 200 523" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="193,523 200,533 207,523" fill="#64748b"/>

  <!-- 步骤 5: 学习率衰减与参数更新 -->
  <g transform="translate(20, 535)">
    <rect x="0" y="0" width="360" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#14532d">5. 学习率与参数物理更新</text>
    <text x="180" y="54" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#15803d">余弦衰减（带预热）</text>
    <text x="180" y="78" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#15803d">W_new = W - η · g_adam</text>
    <text x="180" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#14532d">完成一次参数迭代</text>
  </g>
</svg>
