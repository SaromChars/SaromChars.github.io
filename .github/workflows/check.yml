name: Check and package blog
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_DEPLOY_ENV: preview
          PUBLIC_ENABLE_ANALYTICS: 'false'
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: blog-preview
          path: dist/
          include-hidden-files: true
